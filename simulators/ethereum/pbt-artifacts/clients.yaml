# The client set this simulator is meant to run against.
#
#   ./hive --sim ethereum/pbt-artifacts \
#          --client-file simulators/ethereum/pbt-artifacts/clients.yaml
#
# Only the clients with artifact code are pinned, each to the branch that
# writes EIP-8347's tagged snapshot records (EIPs#12404): geth to pbt,
# nethermind to update-pbt-snapshot-format, until it merges into pbt-state, and
# besu to glamsterdam-devnet-8-pbt. Dockerfile.git clones a branch, not a
# commit, so a push there moves what runs here.
#
# besu builds with Dockerfile.pbt: its PBT branch depends on a besu-stateless
# SNAPSHOT that no public Maven repository serves, so the image builds that
# library from its branch first.
#
# erigon is deliberately unpinned: its preimage export is on stock
# main-latest.
#
# reth is absent on purpose: it has no PBT branch to pin. That gap belongs in
# the matrix as a missing row, not as a client that fails every case.

- client: go-ethereum
  nametag: pbt
  dockerfile: git
  build_args:
    github: CPerezz/go-ethereum
    tag: pbt

- client: nethermind
  nametag: pbt
  dockerfile: git
  build_args:
    github: NethermindEth/nethermind
    tag: update-pbt-snapshot-format

- client: erigon

- client: besu
  nametag: pbt
  dockerfile: pbt
  build_args:
    github: matkt/besu
    tag: glamsterdam-devnet-8-pbt
    stateless_github: besu-eth/besu-stateless
    stateless_tag: feat/partitioned-binary-trie
